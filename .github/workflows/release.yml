# §9: release on tag v* — tauri-action builds the NSIS installer and creates
# the GitHub release. once the real minisign key lands (README operator
# steps), it also signs the updater artifacts and attaches latest.json for
# the in-app updater (§8). pre-key, tauri-action skips latest.json with a
# warning (createUpdaterArtifacts is false), so every tag release is safe.
# a manual workflow_dispatch run stops before the build step (it is guarded
# to tag pushes below), so a branch run can never create a release named
# after the branch — it only validates checkout/setup.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual build test; no release is created

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend deps
        run: pnpm install --frozen-lockfile

      - name: build + release (tauri-action)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign key for the updater artifacts (§8); pubkey lives in
          # tauri.conf.json, private key here only
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ytdlp-gui ${{ github.ref_name }}"
          releaseBody: "see the assets below to download and install the app."
          releaseDraft: false
          # every release is the reachable latest: releases/latest (the updater
          # endpoint) only resolves full releases, so no tag is marked as a
          # prerelease — otherwise the in-app update can never see it without a
          # manual make_latest promotion (verified live on alpha.11).
          prerelease: false
          includeUpdaterJson: true
